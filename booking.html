<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackmate | Railway Reservation</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .booking-page {
            min-height: 100vh;
        }

        .booking-wrap {
            width: min(1080px, calc(100% - 30px));
            margin: auto;
            padding: 42px 0;
        }

        .booking-panel {
            background: #fff;
            border-radius: 18px;
            padding: 24px;
            margin: 18px 0;
            box-shadow: 0 12px 40px #10182812;
        }

        .booking-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .booking-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .booking-field label {
            font-size: 13px;
            font-weight: 650;
            color: #344054;
        }

        .booking-field input,
        .booking-field select {
            width: 100%;
            height: 48px;
            padding: 0 12px;
            border: 1px solid #e4e7ec;
            border-radius: 9px;
            background: #fff;
        }

        .booking-primary,
        .booking-secondary,
        .booking-danger {
            border: 0;
            border-radius: 9px;
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 700;
        }

        .booking-primary {
            background: #2563eb;
            color: #fff;
        }

        .booking-secondary {
            background: #eef4ff;
            color: #1d4ed8;
        }

        .booking-danger {
            background: #fff1f0;
            color: #b42318;
        }

        .booking-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .booking-full {
            width: 100%;
            margin-top: 18px;
        }

        .booking-muted {
            color: #667085;
            font-size: 13px;
        }

        .booking-notice {
            padding: 12px;
            margin: 12px 0;
            border-radius: 9px;
        }

        .booking-error {
            background: #fff1f0;
            color: #b42318;
        }

        .booking-success {
            background: #ecfdf3;
            color: #027a48;
        }

        .train-card,
        .booking-card,
        .passenger-card,
        .list-card {
            border: 1px solid #e4e7ec;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .booking-flex {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .booking-hidden {
            display: none !important;
        }

        .booking-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .booking-detail {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .booking-passenger-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        @media (max-width: 650px) {
            .booking-grid,
            .booking-passenger-grid {
                grid-template-columns: 1fr;
            }

            .booking-panel {
                padding: 17px;
            }

            .booking-detail {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>

<body>
<div class="background booking-page">

    <header class="navbar">
        <div class="brand">
            <div class="brand-icon">🚆</div>
            <div>
                <div class="brand-name">Trackmate</div>
                <div class="brand-subtitle">Railways of the Land of Gods</div>
            </div>
        </div>

        <button class="logout" id="logoutButton">Logout</button>
    </header>

    <main class="booking-wrap">

        <section>
            <span class="eyebrow">TRACKMATE RAILWAYS</span>
            <h1>Plan your journey.</h1>
            <p class="booking-muted">
                Search trains, reserve seats and manage your bookings.
            </p>
            <p id="welcomeUser" class="booking-muted"></p>
        </section>

        <!-- TRAIN SEARCH -->

        <section class="booking-panel">
            <h2>Search trains</h2>

            <form id="searchForm">
                <div class="booking-grid">

                    <div class="booking-field">
                        <label for="source">Boarding station</label>
                        <select id="source" required>
                            <option value="">Select station</option>
                        </select>
                    </div>

                    <div class="booking-field">
                        <label for="destination">Destination</label>
                        <select id="destination" required>
                            <option value="">Select station</option>
                        </select>
                    </div>

                    <div class="booking-field">
                        <label for="journeyDate">Journey date</label>
                        <input type="date" id="journeyDate" required>
                    </div>

                </div>

                <button class="booking-primary booking-full" type="submit">
                    Search trains →
                </button>
            </form>

            <div id="searchMessage"></div>
            <div id="trainResults"></div>
        </section>

        <!-- PASSENGER DETAILS AND PAYMENT -->

        <section id="passengerPanel" class="booking-panel booking-hidden">

            <div class="booking-flex">
                <h2>Passenger details</h2>
                <span id="selectedTrainLabel" class="booking-muted"></span>
            </div>

            <p class="booking-muted">
                Maximum 6 passengers. Demo fare ₹500 per passenger.
            </p>

            <form id="bookingForm">

                <div class="booking-field" style="max-width:250px;margin:12px 0">
                    <label for="passengerCount">Number of passengers</label>

                    <select id="passengerCount">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>

                <div id="passengerFields"></div>

                <!-- PAYMENT METHOD -->

                <div class="booking-field" style="max-width:300px;margin-top:12px">

                    <label for="paymentMethod">
                        Payment method (simulated)
                    </label>

                    <select id="paymentMethod" required>
                        <option value="">Select method</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Debit/Credit Card</option>
                        <option value="Net Banking">Net Banking</option>
                    </select>

                </div>

                <!-- FARE CALCULATION -->

                <p id="farePreview" class="booking-muted">
                    Total ₹500
                </p>

                <button class="booking-primary booking-full" type="submit">
                    Confirm booking →
                </button>

            </form>

            <div id="bookingMessage"></div>

        </section>

        <!-- GENERATED TICKET -->

        <section id="ticketPanel" class="booking-panel booking-hidden">

            <h2>🎫 Booking confirmation</h2>

            <div id="ticketDetails"></div>

        </section>

        <!-- BOOKING MANAGEMENT -->

        <section class="booking-panel">

            <div class="booking-flex">

                <h2>Manage bookings</h2>

                <button id="refreshAll" class="booking-secondary" type="button">
                    Refresh
                </button>

            </div>

            <div class="booking-tabs">

                <button
                    class="booking-secondary"
                    type="button"
                    data-tab="myBookings"
                >
                    My bookings
                </button>

                <button
                    class="booking-secondary"
                    type="button"
                    data-tab="waitingList"
                >
                    Waiting list
                </button>

                <button
                    class="booking-secondary"
                    type="button"
                    data-tab="cancellations"
                >
                    Cancellation history
                </button>

                <button
                    class="booking-secondary"
                    type="button"
                    data-tab="coachLookup"
                >
                    Coach positions
                </button>

            </div>

            <!-- MY BOOKINGS -->

            <div id="myBookings" class="booking-tab-content">

                <div id="bookingsList" class="booking-muted"></div>

            </div>

            <!-- WAITING LIST -->

            <div id="waitingList" class="booking-tab-content booking-hidden">

                <div id="waitingListContent"></div>

            </div>

            <!-- CANCELLATION HISTORY -->

            <div id="cancellations" class="booking-tab-content booking-hidden">

                <div id="cancellationsContent"></div>

            </div>

            <!-- COACH POSITIONS -->

            <div id="coachLookup" class="booking-tab-content booking-hidden">

                <div class="booking-field" style="max-width:300px">

                    <label for="coachTrain">Train</label>

                    <select id="coachTrain">
                        <option value="">Search a route first to load trains</option>
                    </select>

                </div>

                <button
                    id="showCoaches"
                    class="booking-secondary"
                    type="button"
                    style="margin-top:10px"
                >
                    Show coaches
                </button>

                <div id="coachResult"></div>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
