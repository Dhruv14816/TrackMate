<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trackmate | Create Account</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="background">

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                🚆
            </div>

            <div>

                <div class="brand-name">
                    Trackmate
                </div>

                <div class="brand-subtitle">
                    Railways of the Land of Gods
                </div>

            </div>

        </div>

    </header>


    <main class="main-container">

        <section class="hero">

            <div class="hero-content">

                <span class="eyebrow">
                    UTTARAKHAND TRAIN SERVICES
                </span>

                <h1>
                    Start your<br>
                    <span>journey with us.</span>
                </h1>

                <p>
                    Create your Trackmate account
                    and start managing your journeys.
                </p>

            </div>

        </section>


        <section class="login-section">

            <div class="login-card">

                <div class="login-header">

                    <div class="login-logo">
                        🚆
                    </div>

                    <h2>
                        Create account
                    </h2>

                    <p>
                        Register to use Trackmate.
                    </p>

                </div>


                <form id="registerForm">


                    <div class="input-group">

                        <label for="name">
                            Full name
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name"
                                maxlength="100"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                ✉️
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                minlength="15"
                                maxlength="128"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <div
                        id="registerMessage"
                        class="login-message"
                    ></div>


                    <button
                        type="submit"
                        class="login-button"
                    >

                        <span>
                            Create account
                        </span>

                        <span class="arrow">
                            →
                        </span>

                    </button>


                </form>


                <div class="login-footer">

                    <span>
                        Already have an account?
                    </span>

                    <a href="/">
                        Login
                    </a>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
